name: Docker Build and Test

on:
  push:
    branches: [ "lab1", "lab2" ]
  pull_request:
    branches: [ "lab1", "lab2" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run docker compose
        uses: hoverkraft-tech/compose-action@v2.0.1
        with:
          compose-file: "./docker-compose.yml"